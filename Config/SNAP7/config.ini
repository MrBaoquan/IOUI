[default]
# ==================== 连接配置 ====================
ip = 192.168.2.1
rack = 0
slot = 1
timeout_ms = 1000
retry_wait_ms = 20

# ==================== 轮询配置 ====================
poll_interval_ms = 100
command_interval_ms = 10
max_consecutive_failures = 3

# ==================== DI配置（开关量输入）====================
# di_area: 输入区域，支持以下选项：
#   PE = 物理输入区 (Process Input, I/E区, 如 IB0, IW10)
#   PA = 物理输出区 (Process Output, Q/A区, 如 QB0, QW10, 用于读取输出状态)
#   MK = 标志位区 (Marker, M区, 如 MB0, MW10)
#   DB = 数据块区 (Data Block, 如 DB1.DBB0)
di_area = PE
# di_db_number: DB块号（仅当 di_area=DB 时有效，其他区域填0）
di_db_number = 0
# di_start: 起始地址（字节偏移，如0表示IB0/QB0/MB0/DB?.DBB0）
di_start = 0
# di_bytes: 字节数量（8字节=64位）
di_bytes = 8

# ==================== DO配置（开关量输出）====================
# 批量输出配置（通道 0-239）
# do_mode: 输出模式
#   bit   = 位模式（默认）  - 连续区域按位输出，8个通道=1字节
#   byte  = 字节模式        - 通道索引即字节地址，每个通道写入1字节(0-255)
#   word  = 字模式          - 通道索引即字地址，每个通道写入1字(0-65535)
#   dword = 双字模式        - 每2个通道组成1个双字地址，写入4字节
do_mode = bit

# do_area: 输出区域，支持以下选项：
#   PA = 物理输出区 (Process Output, Q/A区, 如 QB0, QW10)
#   MK = 标志位区 (Marker, M区, 如 MB0, MW10)
#   DB = 数据块区 (Data Block, 如 DB1.DBB0)
#   PE = 物理输入区 (Process Input, I/E区, 不推荐用于DO，仅特殊场景)
do_area = PA
# do_db_number: DB块号（仅DB区有效）
do_db_number = 1
# do_start: 起始地址（字节偏移）
do_start = 0
# do_bytes: 字节数量（仅位模式有效，其他模式通过通道索引确定地址）
do_bytes = 8

# ==================== 表达式库（可选）====================
# 预定义常用表达式，可在 ai_channel 中通过名称引用
# 表达式支持: +、-、*、/、^、sqrt()、sin()、cos()、ln()、abs() 等
[expressions]
# 编码器角度转换（10bit分辨率=1024刻度，转换为0-360度）
encoder_angle_10bit = x * 360 / 1024

# PT100温度传感器（偏移1000，分辨率0.1℃）
temp_pt100 = (x - 1000) * 0.1

# 华氏温度转摄氏温度
temp_f_to_c = (x - 32) * 5 / 9

# 4-20mA标准信号转换（量程0-100）
current_4_20ma = (x - 4000) / 16000 * 100

# 压力传感器（0-10V对应0-1000kPa）
pressure_0_1000 = x / 10

# ==================== AI配置（模拟量输入）====================
# 格式: ai_channel_N = 区域地址, 数据类型[, 表达式][, 字节序]
# 
# 区域地址格式:
#   DB1.20 或 DB1.DBW20   → DB块1，字节偏移20
#   IW10 或 PE.10        → 输入区I，字节偏移10
#   QW20 或 PA.20        → 输出区Q，字节偏移20
#   MW30 或 MK.30        → 标志区M，字节偏移30
#
# 表达式（三种写法）:
#   1. 直接表达式:    x*0.1, (x-32)*5/9, sqrt(x)*10
#   2. 预定义名称:    encoder_angle_10bit, temp_pt100
#   3. 内联表达式:    {x*360/1024} (花括号可选，效果同1)
#
# 字节序: AB(大端，默认), BA(小端)
#
# 示例:
# ai_channel_0 = DB1.20, int16, x*0.1              # 温度传感器，缩放0.1倍
# ai_channel_1 = DB1.22, int16, temp_f_to_c     # 引用预定义表达式
# ai_channel_2 = DB1.24, float32                # 浮点数，不缩放
# ai_channel_3 = DB1.28, uint16, encoder_angle_10bit  # 编码器角度
# ai_channel_4 = IW10, uint32, x*100+1000, BA  # 小端序
# ai_channel_5 = DB1.50, uint8                  # 状态码（0-255）
# ai_channel_6 = DB1.51, int8, x+100           # 有符号字节（-128~127）

# ==================== 设备专属配置（可选）====================
[device_1]
ip = 127.0.0.1

ai_channel_0 = DB1.200, uint16

# ==================== DI配置（开关量输入）====================
# di_area: 输入区域，支持以下选项：
#   PE = 物理输入区 (Process Input, I/E区, 如 IB0, IW10)
#   PA = 物理输出区 (Process Output, Q/A区, 如 QB0, QW10, 用于读取输出状态)
#   MK = 标志位区 (Marker, M区, 如 MB0, MW10)
#   DB = 数据块区 (Data Block, 如 DB1.DBB0)
di_area = PE
# di_db_number: DB块号（仅当 di_area=DB 时有效，其他区域填0）
di_db_number = 0
# di_start: 起始地址（字节偏移，如0表示IB0/QB0/MB0/DB?.DBB0）
di_start = 0
# di_bytes: 字节数量（8字节=64位）
di_bytes = 8

# do_area: 输出区域，支持以下选项：
#   PA = 物理输出区 (Process Output, Q/A区, 如 QB0, QW10)
#   MK = 标志位区 (Marker, M区, 如 MB0, MW10)
#   DB = 数据块区 (Data Block, 如 DB1.DBB0)
#   PE = 物理输入区 (Process Input, I/E区, 不推荐用于DO，仅特殊场景)
do_area = PA
# do_db_number: DB块号（仅DB区有效）
do_db_number = 1
# do_start: 起始地址（字节偏移）
do_start = 0
# do_bytes: 字节数量（仅位模式有效，其他模式通过通道索引确定地址）
do_bytes = 8