[default]
# 串口号
port_name=COM3
# 波特率
baud_rate=9600
# 输出间隔
write_wait_ms=60

# 帧头
frame_header = FE
# 帧尾
frame_tail = FF
# 通道索引
ch_index = 1
# 值索引
val_index = 2
# 帧长度
frame_length = 4

# 自定义输入帧映射保持超时
hold_timeout_ms=1000

[device_1]
port_name=COM3
baud_rate=9600
frame_header = A5
frame_tail = 5A
ch_index = 1
val_index = 2
frame_length = 4

[input_frame_map]
0 = A5 00 01 5A

[output_frame_map]
0 = A5 01 00 5A