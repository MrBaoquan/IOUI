[default]
# 数据位
data_bit=8
# 停止位
stop_bit=1
# 校验位 N-无校验 E-偶校验 O-奇校验
parity=N

# 从机地址（支持格式: 0x01 (十六进制) 或 1 (十进制)，范围: 1-247）
slave_addr=1

# 命令超时响应
timeout_ms=100
# 指令失败重试等待
retry_wait_ms=20

# 轮询间隔（ms）- 每轮读取完成后的等待时间，控制数据刷新频率
poll_interval_ms=20
# 命令间隔（ms）- 连续读取命令之间的间隔，避免设备响应不过来
command_interval_ms=10

# 断线检测阈值 - 连续失败多少次判定为断线（默认: 3，设为0则禁用断线重连）
# 设置太小：偶尔丢包就判定断线，误判率高
# 设置太大：真正断线时检测慢
# 推荐值：2-5次
max_consecutive_failures=3

## 开关量输入相关配置
# di 功能码        01 读取线圈状态(可读写)  02 读取离散输入状态(只读)
# 支持格式: 0x02 (十六进制) 或 2 (十进制)
di_func=0x02
# 读取DI地址        
di_addr=0x0000
# 读取DI通道数
di_num=0x0000

## 模拟量输入相关配置
# ai 功能码         03 读取保持寄存器(可读写)   04 读取输入寄存器（只读）
# 支持格式: 0x04 (十六进制) 或 4 (十进制)
ai_func=0x04

# 格式: ai_channel = 地址, 数据类型, [表达式], [字节序], [功能码]
# 
# 表达式: 支持数学运算 (+ - * / ^) 和函数 (abs, sqrt, sin, cos, ln 等)
#         x 表示读取的原始值，不指定则默认为 x (不缩放)
# 数据类型: uint16, int16, uint32, int32, float32, fixed16_16
# 字节序: AB(大端), BA(小端) - 仅对32位数据有效
# 
# 示例:
#   ai_channel = 0x0000, uint16                    # 不缩放
#   ai_channel = 0x0001, int16, {x*0.1}            # 缩放0.1倍
#   ai_channel = 0x0100, uint32, {x*360/1024}, BA  # 编码器角度转换，小端序
#   ai_channel = 0x0200, float32, {x*1.5+10}       # 线性校准

# DO功能码 (默认: 5， 可在接口中动态设置)
# 5 - 写单个线圈, 6 - 写单个寄存器
# 支持格式: 0x05 (十六进制) 或 5 (十进制)
do_func=0x05

# DO写操作起始地址（线圈/寄存器地址偏移）
do_addr=0x0000

## 表达式库（可选，可在 ai_channel 中通过名称引用，也可直接用内联表达式）
[expressions]
# 编码器角度转换（10bit分辨率，常用于增量/绝对值编码器）
encoder_angle_10bit = x * 360 / 1024
# PT100 温度传感器（标准工业温度传感器，偏移1000，分辨率0.1℃）
temp_pt100 = (x - 1000) * 0.1
# 4-20mA 标准信号转换（工业标准电流信号，量程0-100）
current_4_20ma = (x - 4000) / 16000 * 100

[device_1]
driver=modbus_rtu

# 串口号
port=10
# 从机地址
slave_addr=1
# 波特率
baud_rate=9600

# di 功能码        01 读取线圈状态(可读写)  02 读取离散输入状态(只读)
di_func=0x02
# 读取DI地址        
di_addr=0x0000
# 读取DI通道数
di_num=0x0010

[device_2]
driver=modbus_rtu
# 串口号
port=10
# 从机地址
slave_addr=2
# 波特率
baud_rate=9600


# 示例: 信捷XD3E
[device_3]
# modbus驱动类型  modbus_tcp, modbus_rtu
driver=modbus_tcp
# IP地址
ip=192.168.6.6
# 端口号
port=502

# 从机地址
slave_addr=1

# 读取DI地址    
di_addr=0x5000
# 读取DI通道数
di_num=0x0010
# DO写操作起始地址
do_addr=0x6000


# 示例: 布瑞特编码器
[device_4]
driver=modbus_rtu
port=10
slave_addr=1
baud_rate=115200

# 多圈角度值（编码器值*360/单圈分辨率，10bit分辨率=1024）
ai_channel = 0x0000, uint32, {x*360/1024}
# 圈数
ai_channel_1 = 0x0002, uint16
# 单圈值
ai_channel_2 = 0x0003, uint16, {x*360/1024}


