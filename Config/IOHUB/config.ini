[default]
; ============================================
; === 全局默认配置 ===
; ============================================

; 协议配置（使用 URI 格式）
protocol=udp://127.0.0.1:9000?localport=5000

; 写入等待时间（毫秒，0=不等待，适用于现代硬件；>0=延迟发送避免粘包）
write_wait_ms=0

; 数据格式：auto / ascii / hex
data_format=auto

; 输入通道保持时间（毫秒，0=永久保持，不自动清零）
input_hold_ms=1000

; 缓冲区配置（字节，防止内存溢出）
max_buffer_size=4096

; 输出状态保持（true=持久保持可读取，false=读取后立即重置）
output_hold=false

; === 默认值编码 ===
output_value_on_code=01
output_value_off_code=00
input_value_on_code=01
input_value_off_code=00

; ============================================
; === 标准帧格式配置（工业IO设备通用） ===
; ============================================
; 默认固定帧格式（适用于大多数工业IO设备）
; 固定帧格式: [帧头] [通道号] [值] [帧尾]
; 示例: FE 05 01 FF (帧头=FE, 通道=05, 值=01, 帧尾=FF)
; 
; 设备配置会自动继承这些参数，可以选择性覆盖
; 如果设备使用不同的帧格式，直接在设备配置中覆盖即可
; 如果设备不使用帧格式，留空或不设置即可（会自动使用缓冲累积模式）
frame_header=FE
frame_tail=FF
frame_length=4
channel_index=1
value_index=2
channel_offset=0

; ============================================
; === 设备配置（使用 URI 格式） ===
; ============================================

[device_0]
; 自定义长字符串协议示例（32字节ASCII命令）
; 数据示例：;DMB90008000CR20:DMSZ8000HHHHH.`
protocol=serial:///COM10?baudrate=115200&databits=8&stopbits=1&parity=none
max_buffer_size=2048

[device_1]
; 串口示例（继承默认帧格式：FE [通道] [值] FF）
protocol=serial:///COM11?baudrate=115200&databits=8&stopbits=1&parity=none

[device_2]
; UDP示例
protocol=udp://127.0.0.1:9000?localport=5000

[device_3]
; TCP客户端示例
protocol=tcp://127.0.0.1:8080?reconnect=3000&keepalive=true

[device_4]
; TCP服务器示例
protocol=tcp-server://0.0.0.0:8080?keepalive=true

[device_10]
; ============================================
; 展研 SERIAL-IOFE 协议
; ============================================
; 帧格式: FE [通道号] [值] FF （与默认配置一致）
; 通道号从0开始，标准值编码：01=高电平, 00=低电平
; 
; 示例：FE 00 01 FF → 通道0高电平
;      SetDeviceDO(5, 1) → FE 05 01 FF
protocol=serial:///COM10?baudrate=115200
output_hold=true

[device_11]
; ============================================
; 淘达电子 SERIAL-TDDZ 协议
; ============================================
; 帧格式: AA [通道号] [值] 55
; 通道号从1开始，输出值编码：01=高, 02=低；输入值编码：01=高, 00=低
; 
; 示例：AA 01 01 55 → 硬件通道1高电平 → API通道0=1
;      SetDeviceDO(0, 1) → AA 01 01 55
protocol=serial:///COM10?baudrate=57600
output_hold=true

frame_header=AA
frame_tail=55
channel_offset=1
output_value_on_code=01
output_value_off_code=02

; ============================================
; === 通道映射配置 ===
; ============================================

; === 输入映射 ===
; 格式：通道号=数据（支持ASCII字符串或HEX字节序列）
; 
; 处理策略（自动级联）：
;   1. 直接匹配完整数据包
;   2. 帧处理器提取帧 → 查找自定义映射 → 解析标准帧
;   3. 缓冲累积（兜底）
; 
; 智能匹配：精确 → 子串 → 大小写不敏感
[InputMapping]
; ASCII模式示例
0=OPEN
1=STOP
2=RESET
; 3=PAUSE
; 4=RESUME

; 长字符串示例（支持分包接收）
; 5=;DMB90008000CR20:DMSZ8000HHHHH.`
; 6=;DMB90008000CR20:DMSZ8000SSSSS.`

; HEX模式示例（支持多种格式）
; 10=0xFE01AAFF
; 11=FE02BBFF
; 12=FE 03 CC FF

; === 输出映射 ===
; 格式：通道号=数据
; 
; 处理策略：
;   1. 优先使用自定义映射
;   2. 否则使用标准帧格式：[帧头][通道号][值][帧尾]
[OutputMapping]
; ASCII模式
0=CMD_OPEN
1=CMD_CLOSE
2=CMD_RESET
; 3=CMD_START
; 4=CMD_STOP

; HEX模式
; 5=0xFE0501FF
; 6=FE0601FF
; 7=FE 07 01 FF
; 8=FE0801FF

; 注意：未配置映射的通道会自动使用标准帧格式
;      例如：SetDeviceDO(10, 1) -> FE 0A 01 FF

; ============================================
; === URI 格式说明 ===
; ============================================
;
; 1. TCP 客户端:
;    tcp://host:port?reconnect=3000&keepalive=true
;    - reconnect: 重连间隔（毫秒），默认3000
;    - keepalive: 保持连接，默认true
;
; 2. TCP 服务器:
;    tcp-server://0.0.0.0:port?keepalive=true
;    - 0.0.0.0 表示监听所有网卡
;    - keepalive: 保持连接，默认true
;
; 3. UDP:
;    udp://host:port?localport=5000
;    - localport: 本地端口，默认5000
;
; 4. 串口:
;    serial:///COMx?baudrate=115200&databits=8&stopbits=1&parity=none
;    - baudrate: 波特率（9600/19200/38400/57600/115200等）
;    - databits: 数据位（5/6/7/8），默认8
;    - stopbits: 停止位（1/2），默认1
;    - parity: 校验位（none/odd/even/mark/space），默认none
;
; ============================================