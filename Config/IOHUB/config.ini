[default]
; === 全局默认配置 ===

; 协议配置（使用 URI 格式）
; 默认使用 UDP 协议
protocol=udp://127.0.0.1:9000?localport=5000

; 数据格式：auto / ascii / hex
data_format=auto

; 写入等待时间（毫秒）
write_wait_ms=60

; === 帧格式配置（所有协议均可使用） ===
; 注意：如果不配置帧格式，则使用直接映射模式（通过InputMapping匹配完整数据包）
frame_header=FE
frame_tail=FF
frame_length=4
channel_index=1
value_index=2

; 输出值编码（发送DO时使用）
output_value_on_code=01
output_value_off_code=00

; 输入值编码（接收DI时使用）
input_value_on_code=01
input_value_off_code=00

; 输入通道保持时间（毫秒，0=永久保持，不自动清零）
input_hold_ms=1000

; ============================================
; === 设备配置（使用 URI 格式） ===
; ============================================

[device_0]
; 串口示例
; 格式: serial:///COMx?baudrate=波特率&databits=数据位&stopbits=停止位&parity=校验位
protocol=serial:///COM10?baudrate=115200&databits=8&stopbits=1&parity=none

[device_1]
; UDP示例
; 格式: udp://host:port?localport=本地端口
protocol=udp://127.0.0.1:9000?localport=5000

[device_2]
; TCP客户端示例
; 格式: tcp://host:port?reconnect=毫秒&keepalive=true/false
protocol=tcp://127.0.0.1:8080?reconnect=3000&keepalive=true
write_wait_ms=50

[device_3]
; TCP服务器示例
; 格式: tcp-server://监听地址:端口?keepalive=true/false
protocol=tcp-server://0.0.0.0:8080?keepalive=true

[device_10]
; ============================================
; 展研 SERIAL-IOFE 协议示例
; ============================================
; 帧格式: FE [通道号] [值] FF
; 特点: 通道号从0开始 (0, 1, 2, ...)
; 输入示例: FE 00 01 FF  表示通道0接收到值1
; 输出示例: FE 05 01 FF  表示向通道5发送值1
protocol=serial:///COM10?baudrate=115200

frame_header=FE
frame_tail=FF
frame_length=4
channel_index=1
value_index=2
channel_offset=0
; channel_offset=0 表示通道从0开始编号
; 使用默认值编码: 01=高电平, 00=低电平（输入输出一致）

[device_11]
; ============================================
; 淘达电子 SERIAL-TDDZ 协议示例
; ============================================
; 帧格式: AA [通道号] [值] 55
; 特点: 
;   1. 通道号从1开始 (1, 2, 3, ...)
;   2. 输入输出值编码不同:
;      - 输出: 0x01=高电平, 0x02=低电平
;      - 输入: 0x01=高电平, 0x00=低电平
; 输入示例: 
;   AA 01 01 55  表示通道1高电平（对应API通道0=1）
;   AA 01 00 55  表示通道1低电平（对应API通道0=0）
; 输出示例: 
;   SetDeviceDO(0, 1) -> AA 01 01 55  (通道1, 高电平)
;   SetDeviceDO(0, 0) -> AA 01 02 55  (通道1, 低电平)
; 注意: 
;   - 淘达电子硬件通道编号从1开始
;   - API中的通道号仍从0开始
;   - 通过channel_offset=1自动转换通道号
;   - 输出值映射: API 0->0x02, API 1->0x01
;   - 输入值映射: 0x00->API 0, 0x01->API 1
protocol=serial:///COM10?baudrate=57600

frame_header=AA
frame_tail=55
frame_length=4
channel_index=1
value_index=2
channel_offset=1

; 输出值编码（发送DO时使用）
output_value_on_code=01
output_value_off_code=02

; ============================================
; === 通道映射配置 ===
; ============================================

; === 输入映射 ===
; 格式：通道号=数据
; 数据可以是ASCII字符串或HEX字节序列
; 输入处理优先级：
;   1. 如果配置了帧格式，先提取完整帧
;   2. 尝试匹配InputMapping（帧内容或完整数据包）
;   3. 如果有帧格式，尝试解析标准帧（通道号+值）
[InputMapping]
; ASCII模式示例
; 0=START
; 1=STOP
; 2=RESET
; 3=PAUSE
; 4=RESUME

; HEX模式示例（支持多种格式）
; 10=0xFE01AAFF
; 11=FE02BBFF
; 12=FE 03 CC FF

; === 输出映射 ===
; 输出处理优先级：
;   1. 优先查找OutputMapping中的自定义映射
;   2. 如果未找到且配置了帧格式，使用标准帧格式输出
;      格式：[帧头][通道号][值][帧尾]
;   3. 如果都未配置，则不发送数据
[OutputMapping]
; ASCII模式
; 0=CMD_OPEN
; 1=CMD_CLOSE
; 2=CMD_RESET
; 3=CMD_START
; 4=CMD_STOP

; HEX模式
; 5=0xFE0501FF
; 6=FE0601FF
; 7=FE 07 01 FF
; 8=FE0801FF

; 注意：通道 9-254 未配置映射，如果配置了帧格式，
;      将自动使用标准帧格式发送，例如：
;      通道10，值1 -> FE 0A 01 FF （假设frame_header=FE, frame_tail=FF）

; ============================================
; === URI 格式说明 ===
; ============================================
;
; 1. TCP 客户端:
;    tcp://host:port?reconnect=3000&keepalive=true
;    - reconnect: 重连间隔（毫秒），默认3000
;    - keepalive: 保持连接，默认true
;
; 2. TCP 服务器:
;    tcp-server://0.0.0.0:port?keepalive=true
;    - 0.0.0.0 表示监听所有网卡
;    - keepalive: 保持连接，默认true
;
; 3. UDP:
;    udp://host:port?localport=5000
;    - localport: 本地端口，默认5000
;
; 4. 串口:
;    serial:///COMx?baudrate=115200&databits=8&stopbits=1&parity=none
;    - baudrate: 波特率（9600/19200/38400/57600/115200等）
;    - databits: 数据位（5/6/7/8），默认8
;    - stopbits: 停止位（1/2），默认1
;    - parity: 校验位（none/odd/even/mark/space），默认none
;
; ============================================
; === 协议对比说明 ===
; ============================================
;
; 【展研 SERIAL-IOFE 协议】
;   帧格式:   FE [通道号] [值] FF
;   波特率:   115200（默认）
;   通道编号: 从0开始 (0, 1, 2, 3, ...)
;   帧长度:   4字节
;   
;   配置示例:
;     frame_header=FE
;     frame_tail=FF
;     channel_offset=0
;   
;   数据示例:
;     发送: SetDeviceDO(通道0, 值1) -> FE 00 01 FF
;     接收: FE 05 01 FF -> GetDeviceDI(通道5) = 1
;
; 【淘达电子 SERIAL-TDDZ 协议】
;   帧格式:   AA [通道号] [值] 55
;   波特率:   57600（默认）
;   通道编号: 从1开始 (1, 2, 3, 4, ...)
;   帧长度:   4字节
;   特殊处理: 通道号需要偏移+1，输入输出值编码不同
;   
;   配置示例:
;     frame_header=AA
;     frame_tail=55
;     channel_offset=1
;     output_value_on_code=01
;     output_value_off_code=02
;     input_value_on_code=01
;     input_value_off_code=00
;   
;   数据示例:
;     输出DO: SetDeviceDO(通道0, 值1) -> AA 01 01 55  (通道1, 高电平0x01)
;     输出DO: SetDeviceDO(通道0, 值0) -> AA 01 02 55  (通道1, 低电平0x02)
;     输入DI: AA 06 01 55 -> GetDeviceDI(通道5) = 1    (通道6, 高电平0x01)
;     输入DI: AA 06 00 55 -> GetDeviceDI(通道5) = 0    (通道6, 低电平0x00)
;
; 【主要区别】
;   1. 帧头/帧尾:   IOFE用FE/FF, TDDZ用AA/55
;   2. 波特率:      IOFE用115200, TDDZ用57600
;   3. 通道编号:    IOFE从0开始, TDDZ从1开始（需设置channel_offset=1）
;   4. 值映射:      
;      IOFE: 输入输出一致 (0=0x00, 1=0x01)
;      TDDZ: 输入输出不同
;            输出 (0=0x02, 1=0x01)
;            输入 (0=0x00, 1=0x01)
;   5. 配置参数:
;      IOFE: 可省略值编码配置（使用默认）
;      TDDZ: 必须配置output_value_on/off_code和input_value_on/off_code
;
; 注意: channel_offset和value编码参数会自动处理转换，API始终使用标准0/1值
;
; ============================================